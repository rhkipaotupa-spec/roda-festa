name: Admin Commercial V1 Validation

on:
  push:
    branches:
      - feat/admin-commercial-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Admin Commercial tests
        run: node --test tests/admin-commercial-v1-*.test.mjs

      - name: Full test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
